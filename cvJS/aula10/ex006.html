<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>

    <style>
        div#area {
            font: normal 20pt Arial;
            background: rgb(21, 92, 15);
            color: white;
            height: 200px;
            width: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Eventos DOM</h1>
    <p>Carregando...</p>
    <div id = "area" >
        <!--onclick="clicar()" onmouseenter = "entrar()" onmouseout="saiu()"-->
        Interaja ...
    </div>


    <script>
        //não é bom usar dessa forma, por memório, estude escopo
        var area = window.document.getElementById("area")
        area.addEventListener('click', clicar)
        area.addEventListener('mouseenter', entrar)
        area.addEventListener('mouseout', saiu)


        function clicar() {
            //bloco
            
            area.innerText = 'Clicou'
            area.style.background = 'blue'
        }

        function entrar(){
            area.innerText = 'Entrou'
        }

        function saiu(){
            area.innerText = 'Saiu'
            area.style.background = 'red'
        }
    </script>
</body>
</html>
