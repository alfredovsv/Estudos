<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header>
        <h1>Tabuada</h1>
    </header>

    <section>
        <div id="form">
            <form id="formToTabuada">
                <p>Número:
                    <input type="number" name="numero" id="numero">
                    <input id="gerar" type="button" value="Gerar Tabuada">
                </p>
            </form>

        </div>
        <div id="resultado">
            <select size="12" name="tabuada" id="tabuada">
                <option value="nenhum">Defina um número acima</option>
            </select>
        </div>

    </section>

    <footer>
        <p>&copy; AlfredoVicente</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
