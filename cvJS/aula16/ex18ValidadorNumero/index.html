<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAlidador de Número</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header>
        <h1>Validador de Número</h1>
    </header>

    <section>
        <div id="form">
            <form id="formNum">
                <p>Número [entre 1 e 100]:
                    <input type="number" name="numero" id="numero">
                    <input id="adicionar" type="button" value="Adicionar">
                </p>
            </form>

        </div>
        <div id="resultado">
            <select size="12" name="matrizNum" id="matrizNum">
                <option value="nenhum">Adicione os números</option>
            </select>

             <input id="finalizar" type="button" value="Finalizar">
        </div>

    </section>

    <footer>
        <p>&copy; AlfredoVicente</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
