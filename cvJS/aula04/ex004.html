<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de String</title>

    <style>
        body {
            font: normal 20pt Arial;
        }
    </style>


</head>
<body>
    <script>
        var nome = window.prompt('Qual o seu nome?')
        document.writeln(`Olá, ${nome}! Seu nome tem ${nome.length} letras </br>` )
        document.writeln (`Seu nome em maiúsculas é ${nome.toUpperCase()} </br>`)
        document.writeln (`Seu nome em minuscula é ${nome.toLowerCase()}`)
    </script
    
</body>
</html>
