<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa ...</title>

    <style>
        body {
            background-color: #2a2a55;
            color: white;
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Comecei o curso com pé direito!!!</p>

    <script>
        // window.alert('Minha primeira mensagem')
        // window.confirm('Esta gostando da aula?');
        var n1 = Number.parseInt (window.prompt('Número 1'))
        var n2 = window.prompt('Número 2')

        //Antes temos que converte, pois n1 e n2 é string
        var s = n1 + Number.parseFloat(n2) 

        //Agora no java scprit pode usar apenas number
        s = Number(s)
        s = s.toString() + 1 //Aqui vai concatenar e não somar

        //window.alert('A soma é ' + s)
    
        var msg = `A soma entre n1 e n2 é ${s}`
        window.alert (msg)

        
    </script>
</body>
</html>
