<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>

    <style>
        h1 { /*box-level*/
            /*Posso misturar display: inline-block*/
            background-color: lightgray;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;
            /*shorthand para borda*/
            border: 10px solid darkslateblue;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /*shorthand para padding*/
            padding: 10px 10px 10px 10px;
            padding: 10px; /*todo mundo fica 10px*/
            padding: 10px 20px; /*top e bottom 10px  right e left 20px*/

            /* margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px; */
            margin: auto; /* centralizar*/
            /*shorthand para margin*/
            margin: 20px auto 10px auto;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: coral;
            /*shorthand para outline*/
            outline: 10px dashed coral;

        }

        a { /*inline-level*/
            border-width: 10px;
            border-style: groove; /*dotted, solid, dashed, groove */
            border-color: red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exmeplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-leve, mas os <a href="#">os links são exemplo de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
