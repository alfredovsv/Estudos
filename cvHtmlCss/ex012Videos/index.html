<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos como HTML5</title>
</head>
<body>
    <h1>Inserindovídoes hospedados localmente</h1>
    <p>Esse vídeo está hopedado localmente</p>

    <video  width="560" poster="img/capa-video.jpg" controls>
        <source src="midia/video-teste-reduzido.ogv" type="video/ogg"> <!--Note ogg é padrão-->
        <source src="midia/video-teste-reduzido.mp4" type="video/mp4">
        <source src="midia/video-teste.mp4" type="video/mp4">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeo</p>
    </video>

    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/Yu3xfcJrodg?si=-LGnr3AJE05qAotg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h1>Inserindo vídeos do Vimeo</h1>

</html>
